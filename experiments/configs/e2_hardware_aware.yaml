  mixers: [x, xy_ring]
  p: [1, 2]
  backends: ["generic_line_{n}", generic_heavyhex_d3, fake27_snapshot, "generic_all_to_all_{n}"]
  optimization_levels: [1, 3]
  seeds: [0, 1, 2]
quick:
  instances: {sizes: [4], domains: [portfolio]}
  transpilation: {p: [1], optimization_levels: [1], seeds: [0], backends: ["generic_line_{n}"]}
